name: Linux

on:
  workflow_call:
    inputs:
      package_name:
        description: 'Package Name'
        type: string
      version:
        description: 'Package Version'
        type: string

jobs:
    ubuntu:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Installing Linux Prerequisites
              run: |
                  sudo apt-get update
                  sudo apt install software-properties-common libxml2 -y
                  sudo add-apt-repository ppa:deadsnakes/ppa

            - name: Install LLVM's C++ STL
              run: sudo apt-get install libc++-20-dev libc++abi-20-dev

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                python-version: '3.x'

            - name: Installing Prerequisites for Linux
              run: |
                  sudo apt-get update
                  sudo apt install software-properties-common -y
                  sudo add-apt-repository ppa:deadsnakes/ppa

            - name: Install Vulkan SDK
              uses: humbletim/setup-vulkan-sdk@v1.2.1
              with:
                vulkan-query-version: 1.4.304.1
                vulkan-components: Vulkan-Headers, Vulkan-Loader
                vulkan-use-cache: true

            - name: Installing Conan
              run: pipx install "conan>=2.18.1"

            - name: Setting up Conan Profiles
              run: conan config install -sf profiles/x86_64/linux/ -tf profiles https://github.com/engine3d-dev/conan-config.git

            - name: Setting up Conan
              run: |
                conan config install https://github.com/engine3d-dev/conan-config.git
                conan atlas setup

            - name: Creating Release build for ${{inputs.package_name}}/${{inputs.version}}
              run: conan atlas create . -s build_type=Release
            
            - name: Creating Debug build for ${{inputs.package_name}}/${{inputs.version}}
              run: conan atlas create . -s build_type=Debug
            
            - name: Creating MinSizeRel build for ${{inputs.package_name}}/${{inputs.version}}
              run: conan atlas create . -s build_type=MinSizeRel

