
name: Package 📦 + 🚀 Deploy Windows

on:
  workflow_dispatch:
    workflow_call:
      inputs:
        library:
          type: string
          default: engine3d-dev/TheAtlasEngine
        repo:
          type: string
          default: engine3d-dev/TheAtlasEngine
        conan_version:
          type: string
          default: "2.6.0"
        version:
          type: string
          default: ""
        arch:
          type: string
          required: true
        os:
          type: string
          required: true

jobs:
  deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4.1.1
        with:
          submodules: true
          repository: engine3d-dev/TheAtlasEngine
          ref: 1.0

      - uses: actions/checkout@v4.1.1
        # if: ${{ inputs.version == '' || inputs.external_package == true}}
        with:
          submodules: true
          repository: engine3d-dev/TheAtlasEngine
      
      - name: 📥 Install OS Specific Tools
        run: |
          winget install Microsoft.VisualStudio.2022.BuildTools --override "--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended -p --installWhileDownloading"
          Set-ExecutionPolicy Bypass -Scope Process -Force; [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072; iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
          choco install git
          choco install python --version=3.12.0
          choco install llvm
          pip install "conan>=2.10.2"

          choco install make cmake
          choco install mingw
          winget install --id=KhronosGroup.VulkanSDK -e
          

      - name: 📥 Install Conan 2.2.0
        run: pipx install conan==2.2.0

      - name: 📡 Add `libhal` repo to conan remotes
        run: conan remote add engine3d-conan
             https://libhal.jfrog.io/artifactory/api/conan/engine3d-conan

      - name: 📡 Create and setup default profile
        run: conan profile detect --force

      - name: 👁️‍🗨️ Show conan profile
        run: conan profile show

      - name: 📡 Install Windows default profiles
        run: conan config install -sf profiles/x86_64/Windows/ -tf profiles https://github.com/engine3d-dev/conan-config.git

      # - name: Set Version Environment Variable
      #   run: |
      #     if [ -z "1.0" ]; then
      #       echo "VERSION=latest" >> $GITHUB_ENV
      #     else
      #       echo "VERSION=${{ inputs.version }}" >> $GITHUB_ENV
      #     fi

      - name: 📦 Create `Release` package for TheAtlasEngine
        run: conan build . -b missing

      - name: 📡 Sign into JFrog Artifactory
        # if: ${{ inputs.version != '' }}
        env:
          PASSWORD: ${{ secrets.JFROG_TRUNK_ID }}
          JFROG_USER: ${{ secrets.JFROG_USER }}
        run: conan remote login -p $PASSWORD libhal $JFROG_USER

      - name: 🆙 Upload package version 1.0 to `TheAtlasEngine` repo
        # if: ${{ inputs.version != '' }}
        # TODO: This needs to change eventually to work with the input version from the CI.
        run: conan upload "atlas/1.0" --confirm -r=engine3d-conan
